<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Flow AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root, [data-theme="dark_default"] {
        --color-primary: #0D1117;
        --color-secondary: #161B22;
        --color-accent: rgba(34, 41, 51, 0.5);
        --color-border: rgba(255, 255, 255, 0.1);
        --color-text-primary: #E6EDF3;
        --color-text-secondary: #B0BAC6;
        --color-highlight: #58A6FF;
        --color-base-bg: #151515;

        --color-neon-purple: #9C5EFF;
        --color-neon-blue: #00C6FF;
        
        --color-brand-teal: #33C5B1;
        --color-brand-blue: #4E95F2;
        --color-brand-purple: #A371F7;
        --color-brand-pink: #E96ED4;
        --color-brand-green: #52D186;
        --color-brand-yellow: #F2C94C;
        --color-brand-red: #EB5757;
      }

      [data-theme="light"] {
        --color-primary: #FFFFFF;
        --color-secondary: #F6F8FA;
        --color-accent: rgba(230, 230, 230, 0.5);
        --color-border: rgba(0, 0, 0, 0.1);
        --color-text-primary: #1F2328;
        --color-text-secondary: #57606A;
        --color-highlight: #0969DA;
        --color-base-bg: #F0F2F5;

        --color-neon-purple: #8A3FFC;
        --color-neon-blue: #0072C3;
        
        --color-brand-teal: #1A9A8A;
        --color-brand-blue: #0969DA;
        --color-brand-purple: #8A3FFC;
        --color-brand-pink: #D039BE;
        --color-brand-green: #1F883D;
        --color-brand-yellow: #BF8700;
        --color-brand-red: #CF222E;
      }
      
      [data-theme="tokyo_night"] {
        --color-primary: #1a1b26;
        --color-secondary: #24283b;
        --color-accent: rgba(41, 45, 62, 0.5);
        --color-border: rgba(122, 128, 153, 0.2);
        --color-text-primary: #c0caf5;
        --color-text-secondary: #a9b1d6;
        --color-highlight: #7aa2f7;
        --color-base-bg: #16161e;

        --color-neon-purple: #bb9af7;
        --color-neon-blue: #7dcfff;
        
        --color-brand-teal: #449dab;
        --color-brand-blue: #7aa2f7;
        --color-brand-purple: #bb9af7;
        --color-brand-pink: #ff79c6;
        --color-brand-green: #9ece6a;
        --color-brand-yellow: #e0af68;
        --color-brand-red: #f7768e;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'primary': 'var(--color-primary)',
              'secondary': 'var(--color-secondary)',
              'accent': 'var(--color-accent)',
              'border-color': 'var(--color-border)',
              'text-primary': 'var(--color-text-primary)',
              'text-secondary': 'var(--color-text-secondary)',
              'highlight': 'var(--color-highlight)',

              'neon-purple': 'var(--color-neon-purple)',
              'neon-blue': 'var(--color-neon-blue)',
              'base-bg': 'var(--color-base-bg)',

              'brand-teal': 'var(--color-brand-teal)',
              'brand-blue': 'var(--color-brand-blue)',
              'brand-purple': 'var(--color-brand-purple)',
              'brand-pink': 'var(--color-brand-pink)',
              'brand-green': 'var(--color-brand-green)',
              'brand-yellow': 'var(--color-brand-yellow)',
              'brand-red': 'var(--color-brand-red)',
            },
            borderRadius: {
                'xl': '1rem',
                '2xl': '1.5rem',
                '3xl': '2rem',
            },
            boxShadow: {
                'soft-glow': '0 0 25px -5px rgba(88, 166, 255, 0.15)',
                'soft-glow-neon': '0 0 40px -10px rgba(156, 94, 255, 0.3)',
                'inner-soft': 'inset 0 1px 2px 0 rgba(255, 255, 255, 0.05)',
            },
            backdropBlur: {
              'xl': '20px',
              '2xl': '32px',
            },
            keyframes: {
              subtleAurora: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 15px -5px rgba(156, 94, 255, 0.2)' },
                '50%': { boxShadow: '0 0 30px -5px rgba(156, 94, 255, 0.5)' },
              },
            },
            animation: {
              subtleAurora: 'subtleAurora 30s ease infinite',
              pulseGlow: 'pulseGlow 4s ease-in-out infinite',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.3.19"
  }
}
</script>
</head>
  <body class="bg-base-bg text-text-primary font-sans antialiased">
    <div class="fixed inset-0 -z-10 bg-base-bg">
        <div class="absolute inset-0 bg-[linear-gradient(145deg,rgba(156,94,255,0.1)_0%,rgba(0,198,255,0.1)_50%,rgba(82,209,134,0.1)_100%)] bg-[length:200%_200%] animate-subtleAurora"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
